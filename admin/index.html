      .c1-boot-mark {
        position: fixed;
        left: calc(50% - 62px);
        top: calc(38% - 62px);
        width: 124px;
        height: 124px;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 16px;
        background: #172442;
      }
      .c1-boot-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      @media (max-width: 800px) {
        .c1-boot-mark {
          top: calc(38% - 92px);
        }
      }
    </style>
